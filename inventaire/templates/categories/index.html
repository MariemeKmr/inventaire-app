{% extends "base.html" %}
{% block title %}Catégories{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Catégories</h3>
  <a class="btn btn-primary" href="{% url 'categories:new' %}">Nouvelle catégorie</a>
</div>

<div class="card">
  <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead><tr><th>Nom</th><th class="text-end">Actions</th></tr></thead>
      <tbody>
        {% for c in categories %}
          <tr>
            <td>{{ c.nom }}</td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-secondary" href="{% url 'categories:edit' c.pk %}">Renommer</a>
              <a class="btn btn-sm btn-outline-danger" href="{% url 'categories:delete' c.pk %}">Supprimer</a>
            </td>
          </tr>
        {% empty %}
          <tr><td colspan="2" class="text-muted">Aucune catégorie.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
