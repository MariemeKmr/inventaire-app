<form class="app-search container-fluid bg-white border-bottom py-2 px-3" role="search" method="get" action="{% url 'products:list' %}">
  <div class="row g-2 align-items-center">
    <div class="col-12 col-md-8 col-lg-6">
      <input class="form-control" type="search" placeholder="Rechercher (nom, code-barres…)" name="q" id="globalSearch" value="{{ request.GET.q }}">
    </div>
    <div class="col-auto">
      <button class="btn btn-outline-primary"><i class="fa-solid fa-magnifying-glass me-1"></i> Rechercher</button>
    </div>
  </div>
</form>
