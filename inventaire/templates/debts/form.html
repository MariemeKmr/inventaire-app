{% extends "base.html" %}
{% block title %}{% if mode == "edit" %}Modifier dette{% else %}Nouvelle dette{% endif %}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h5 mb-0">{% if mode == "edit" %}Modifier la dette{% else %}Nouvelle dette{% endif %}</h1>
  <a class="btn btn-outline-secondary btn-sm" href="{% url 'debts:list' %}">Annuler</a>
</div>

<div class="card p-3" style="max-width:720px;">
  <form method="post">
    {% csrf_token %}
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nom client</label>
        <input name="nom_client" value="{{ form.nom_client|default_if_none:'' }}" class="form-control" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Téléphone</label>
        <input name="telephone" value="{{ form.telephone|default_if_none:'' }}" class="form-control">
      </div>
      <div class="col-md-4">
        <label class="form-label">Montant (€)</label>
        <input name="montant" type="number" step="0.01" min="0.01" value="{{ form.montant|default_if_none:'' }}" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Date de la dette</label>
        <input name="date_dette" type="date" value="{{ form.date_dette|default_if_none:'' }}" class="form-control" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Statut</label>
        <select name="statut" class="form-select">
          <option value="EN_COURS" {% if form.statut == "EN_COURS" %}selected{% endif %}>En cours</option>
          <option value="PARTIEL" {% if form.statut == "PARTIEL" %}selected{% endif %}>Partiel</option>
          <option value="PAYEE" {% if form.statut == "PAYEE" %}selected{% endif %}>Payée</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Produits (texte)</label>
        <textarea name="produits_txt" class="form-control" rows="2">{{ form.produits_txt|default_if_none:'' }}</textarea>
      </div>
      <div class="col-12">
        <label class="form-label">Remarques</label>
        <textarea name="remarques" class="form-control" rows="2">{{ form.remarques|default_if_none:'' }}</textarea>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-3">
      <a class="btn btn-outline-secondary" href="{% url 'debts:list' %}">Annuler</a>
      <button class="btn btn-primary">{% if mode == "edit" %}Enregistrer{% else %}Créer{% endif %}</button>
    </div>
  </form>
</div>
{% endblock %}
